# Production - pulls from ghcr.io
services:
  embeddy:
    image: ghcr.io/cedrugs/embeddy:latest
    container_name: embeddy
    ports:
      - "8080:8080"
    volumes:
      - embeddy-data:/data
    environment:
      - RUST_LOG=info
      - EMBEDDY_DATA_DIR=/data
      - EMBEDDY_MODEL=sentence-transformers/all-MiniLM-L6-v2
      - EMBEDDY_CACHE_SIZE=10000
    restart: unless-stopped

volumes:
  embeddy-data:
    driver: local
